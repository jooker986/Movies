
name: YTS Movies Pro Ultra

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: yts-telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: |
            yts_movies.db
            yts_movies.db-shm
            yts_movies.db-wal
          key: ${{ runner.os }}-yts-db-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-yts-db-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "python-telegram-bot[job-queue]>=21,<23" aiohttp

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          DB_PATH: yts_movies.db
        run: python -u bot.py
