
name: YTS Movies Pro Ultra

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

concurrency:
  group: yts-ultra-runner
  cancel-in-progress: false

jobs:
  run-yts-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore Database
        uses: actions/cache@v4
        with:
          path: data/
          key: yts-ultra-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            yts-ultra-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "python-telegram-bot[job-queue]==21.10" aiohttp

      - name: Start Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHED_MOVIES: ${{ vars.WATCHED_MOVIES }}
          GITHUB_ACTIONS: "true"
          GITHUB_SESSION_SECONDS: "20700"
          CHECK_INTERVAL: "600"
        run: python bot.py
